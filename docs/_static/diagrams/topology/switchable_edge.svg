<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" font-family="Trebuchet MS, Verdana, Arial, sans-serif">
  <title>Switchable edge</title>
  <defs>
    <marker id="arrow-se" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="340" height="150" rx="6" ry="6" fill="#ffffde" stroke="#aaaa33" stroke-width="1"/>
  <text x="190" y="42" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">open() &#8212; resistance from geometry</text>

  <rect x="400" y="20" width="340" height="150" rx="6" ry="6" fill="#ffffde" stroke="#aaaa33" stroke-width="1"/>
  <text x="570" y="42" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">close() &#8212; resistance = R_MAX</text>
  <text x="570" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">(effectively sealed)</text>

  <line x1="155" y1="120" x2="224" y2="120" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-se)"/>
  <line x1="535" y1="120" x2="604" y2="120" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-se)"/>

  <rect x="45" y="100" width="110" height="40" rx="6" ry="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="100" y="125" text-anchor="middle" font-size="14" fill="#333333">Port 1</text>

  <rect x="225" y="100" width="110" height="40" rx="6" ry="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="280" y="125" text-anchor="middle" font-size="14" fill="#333333">Port 2</text>

  <rect x="425" y="100" width="110" height="40" rx="6" ry="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="480" y="125" text-anchor="middle" font-size="14" fill="#333333">Port 1</text>

  <rect x="605" y="100" width="110" height="40" rx="6" ry="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="660" y="125" text-anchor="middle" font-size="14" fill="#333333">Port 2</text>
</svg>
